plugins {
    id 'com.android.application'
}

// Release signing. The key itself is never committed: a local build reads
// android/keystore.properties (git-ignored), and CI assembles the same file
// from repository secrets before Gradle runs. Without either, release builds
// are left unsigned on purpose rather than silently signed with a throwaway
// key, because App Links only verify against one stable certificate.
def releaseProps = new Properties()
def releasePropsFile = rootProject.file('keystore.properties')
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
}

def releaseKeyPath = System.getenv('ORU_KEYSTORE_FILE') ?: releaseProps.getProperty('storeFile')
def releaseStorePassword = System.getenv('ORU_STORE_PASSWORD') ?: releaseProps.getProperty('storePassword')
def releaseKeyAlias = System.getenv('ORU_KEY_ALIAS') ?: releaseProps.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('ORU_KEY_PASSWORD') ?: releaseProps.getProperty('keyPassword')
def hasReleaseKey = releaseKeyPath != null && releaseStorePassword != null && releaseKeyAlias != null

android {
    namespace 'com.oru.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.oru.app"
        minSdk 24
        targetSdk 34
        // 1.1: every oru.freebuff.app link opens the app on the screen it
        // names, and the app finally has a Drops screen of its own.
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(releaseKeyPath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        // Media3 gates many useful APIs (setMediaMetadata, MediaSession APIs,
        // PlayerNotificationManager, ...) behind @UnstableApi. Instead of
        // scattering @OptIn annotations everywhere in Java sources, we opt the
        // whole app into the unstable surface by disabling the lint gate.
        disable 'UnsafeOptInUsageError'
        disable 'UnsafeOptInUsageWarning'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Media3 (ExoPlayer)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'

    // Preferences
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Google sign-in through Credential Manager
    implementation 'androidx.credentials:credentials:1.2.2'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.2'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
