distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# The canonical URL redirects to GitHub's release CDN, which was answering 504
# for every Gradle distribution. This mirror serves the identical artifact and
# distributionSha256Sum below is the checksum Gradle publishes, so a tampered
# file is refused rather than trusted.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
distributionSha256Sum=544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d
networkTimeout=30000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
