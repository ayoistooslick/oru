# Every push runs the test suite, then builds the native Android app (the
# Gradle project under android/) and publishes a GitHub release with the
# sideloadable APK attached.
#
# The app talks to https://oru.freebuff.app at runtime, so neither job needs
# the site to be up. (This workflow used to Bubblewrap-build a TWA from
# twa-manifest.json; that APK is no longer produced, only the native one.)
#
name: Tests and Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Backend tests
        run: pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build the web app
        run: npm run build

  apk:
    name: Build the Android package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tests
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      # Plain Gradle project: compileSdk 34, minSdk 24, Java 17. The wrapper
      # downloads its own Gradle 8.7, so no Gradle setup step is needed; the
      # cache keeps that download (and the dependency cache) between runs.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      # The release key lives in repository secrets, never in the repository:
      # the App Links fingerprint in public/.well-known/assetlinks.json is tied
      # to it, so every build that should verify has to be signed with this one
      # certificate. Without the secret the job still produces a debug-signed
      # test build and says so, instead of publishing an APK that pretends to
      # be the release.
      - name: Prepare the release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p android/keystore
            printf '%s' "$KEYSTORE" | base64 -d > android/keystore/oru-release.jks
            {
              echo "ORU_KEYSTORE_FILE=keystore/oru-release.jks"
              echo "ORU_STORE_PASSWORD=$STORE_PASSWORD"
              echo "ORU_KEY_ALIAS=${KEY_ALIAS:-oru}"
              echo "ORU_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "No release key in secrets: building a debug-signed test APK (App Links will not verify on it)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the native APK
        run: |
          cd android
          if [ -n "$ORU_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../oru.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../oru.apk
          fi
          ls -lh ../oru.apk

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: oru-android
          path: oru.apk
          if-no-files-found: error

      # The release key lives outside the repository, so a maintainer signs
      # stable builds by hand. Give them a current release package to sign:
      # assembled here, unsigned, and never attached to a published release.
      - name: Build the unsigned release package
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../oru-release-unsigned.apk
          else
            echo "Release signing is configured, so there is nothing to sign by hand."
          fi

      - name: Upload the unsigned release package
        uses: actions/upload-artifact@v7
        with:
          name: oru-release-unsigned
          path: oru-release-unsigned.apk
          if-no-files-found: ignore

      # Builds from main are test builds and are marked pre-release, so
      # /releases/latest/download/oru.apk keeps pointing at a tagged, signed
      # release rather than at whichever commit ran last.
      #
      # Tag pushes publish nothing on purpose: a tag means a stable release, and
      # stable releases are signed with the release key by hand. Letting CI
      # attach a debug build to a tag would replace the signed APK, break App
      # Links verification and break clean upgrades.
      - name: Publish a release with the APK attached
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('build-{0}', github.run_number) }}
          name: ${{ format('Build {0}', github.run_number) }}
          prerelease: true
          body: |
            Native Android APK built from commit ${{ github.sha }}.

            ${{ env.ORU_KEYSTORE_FILE != '' && 'Signed with the ORU release key: this build installs over earlier releases and can verify App Links.' || 'Debug-signed test build: uninstall any earlier Oru build first, and expect oru.freebuff.app links to open the browser before the app.' }}
          files: |
            oru.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub always hands run artifacts over as a zip, which is why the APK had
      # to be extracted before installing. The release carries the raw .apk, so
      # send testers there instead; the /latest/download/ form keeps working as
      # later builds publish new releases.
      - name: Point testers at the raw APK
        run: |
          {
            echo "### Install on a phone"
            echo ""
            echo "Download the APK directly (no unzipping) and open it on the device:"
            echo ""
            echo "https://github.com/${{ github.repository }}/releases/latest/download/oru.apk"
            echo ""
            echo "The *oru-android* artifact above is a zip because GitHub wraps every"
            echo "artifact; use the link instead. Test builds are debug-signed, so"
            echo "uninstall an earlier Oru build first; tagged releases are signed with"
            echo "the ORU release key and install as updates."
          } >> "$GITHUB_STEP_SUMMARY"
