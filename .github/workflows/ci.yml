# Every push runs the test suite, then builds a signed Android package of ORU
# and publishes a GitHub release with the APK attached.
#
# The Android step reads https://oru.freebuff.app, so the site has to be up for
# it to succeed. The test step does not need the site.
#
# Signing secrets (optional, see CONTRIBUTING.md):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_PASSWORD       key password
#   ANDROID_KEY_ALIAS          key alias
# Without them CI generates a throwaway key. That is fine for sideloading a
# test build, but not for Google Play or for upgrades over an installed app.

name: Tests and Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Backend tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build the web app
        run: npm run build

  apk:
    name: Build the Android package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tests
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      # Bubblewrap checks that the SDK folder contains bin/ or tools/ and then
      # runs bin/sdkmanager itself, while modern SDKs keep the tools under
      # cmdline-tools/latest/bin. bin is linked to whichever one is installed.
      - name: Install the Android packages the build needs
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36"
          sdkmanager "build-tools;36.1.0" || echo "build-tools 36.1.0 unavailable, Bubblewrap will install it"
          if [ ! -d "$ANDROID_HOME/bin" ]; then
            sudo ln -s "$(dirname "$(command -v sdkmanager)")" "$ANDROID_HOME/bin"
          fi
          ls -la "$ANDROID_HOME"

      # Bubblewrap's own setup wizard asks questions on stdin, which does not
      # exist on a runner, so the config file is written by hand instead.
      - name: Tell Bubblewrap where the JDK and the Android SDK are
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          test -d "$JAVA_HOME"
          test -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

      - name: Check the live PWA against the quality criteria
        continue-on-error: true
        run: npx --yes @bubblewrap/cli validate --url=https://oru.freebuff.app

      - name: Prepare the signing key
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE="$RUNNER_TEMP/oru.keystore"
          ALIAS="${ANDROID_KEY_ALIAS:-oru}"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "Using the keystore stored in the repository secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found, generating a throwaway key for this run."
            keytool -genkeypair -keystore "$KEYSTORE" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${ANDROID_KEYSTORE_PASSWORD:-oru-local}" \
              -keypass "${ANDROID_KEY_PASSWORD:-oru-local}" \
              -dname "CN=ORU, OU=Build, O=ORU, L=Unknown, ST=Unknown, C=NG"
          fi
          echo "path=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"

      # Bubblewrap writes a Gradle project (app/, gradlew, build.gradle) and
      # overwrites anything already there, so it runs in a scratch directory
      # instead of the repository root.
      - name: Generate the Android project from twa-manifest.json
        run: |
          mkdir -p "$RUNNER_TEMP/twa"
          cp twa-manifest.json "$RUNNER_TEMP/twa/"
          cd "$RUNNER_TEMP/twa"
          npx --yes @bubblewrap/cli update --skipVersionUpgrade
          ls -la

      - name: Build the APK and the app bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'oru-local' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'oru-local' }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_ALIAS: ${{ steps.keystore.outputs.alias }}
        run: |
          cd "$RUNNER_TEMP/twa"
          yes | npx --yes @bubblewrap/cli build \
            --skipPwaValidation \
            --signingKeyPath="$KEYSTORE_PATH" \
            --signingKeyAlias="$KEYSTORE_ALIAS"
          cp app-release-signed.apk "$GITHUB_WORKSPACE/oru.apk"
          cp app-release-bundle.aab "$GITHUB_WORKSPACE/oru.aab"
          ls -lh "$GITHUB_WORKSPACE/oru.apk" "$GITHUB_WORKSPACE/oru.aab"

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: oru-android
          path: |
            oru.apk
            oru.aab
          if-no-files-found: error

      - name: Publish a release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          body: Built from commit ${{ github.sha }}. The APK is attached; install it on a phone to try the build.
          files: |
            oru.apk
            oru.aab
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
