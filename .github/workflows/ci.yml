# Every push runs the test suite, then builds the native Android app (the
# Gradle project under android/) and publishes a GitHub release with the
# sideloadable APK attached.
#
# The app talks to https://oru.freebuff.app at runtime, so neither job needs
# the site to be up. (This workflow used to Bubblewrap-build a TWA from
# twa-manifest.json; that APK is no longer produced, only the native one.)
#
name: Tests and Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Backend tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build the web app
        run: npm run build

  apk:
    name: Build the Android package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tests
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      # Plain Gradle project: compileSdk 34, minSdk 24, Java 17. The wrapper
      # downloads its own Gradle 8.7, so no Gradle setup step is needed.
      - name: Build the native APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      # Debug build: signed with the runner's auto-generated debug key, which
      # is fine for sideloading but does not upgrade cleanly over an earlier
      # Oru install signed with a different key.
      - name: Stage the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk oru.apk
          ls -lh oru.apk

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: oru-android
          path: oru.apk
          if-no-files-found: error

      - name: Publish a release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          body: Native Android APK built from commit ${{ github.sha }}. Download the APK and install it on a phone to try the build. Uninstall any previously installed Oru build first — debug signing keys differ between runs.
          files: |
            oru.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
