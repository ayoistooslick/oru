    <!--
      Android: hand a link to the app before this page paints.

      A shared song, artist, release, playlist, search or tab is addressed in
      the app's own scheme the moment the document starts, so the app takes
      over instead of the browser showing a frame of the same song first. The
      table below mirrors appLinkFor() in src/lib/links.ts; the browser's
      fallback URL is this same page, and the sessionStorage key stops a
      browser without the app from retrying on every reload. Firefox-based
      browsers cannot resolve intent addresses, so they are left to the
      in-page prompt, which knows how to try the bare scheme.
    -->
    <script>
      (function () {
        try {
          if (!/android/i.test(navigator.userAgent)) return;
          if (!/Chrome\/|Chromium\/|SamsungBrowser\/|EdgA\/|OPR\//.test(navigator.userAgent)) return;
          if (sessionStorage.getItem("oru-app-off")) return;

          var parts = location.pathname.split("/").filter(Boolean);
          var app = "";
          var web = "";
          var hosts = { song: "song", artist: "artist", release: "release", library: "playlist" };
          var tabs = {
            listen: "listen",
            library: "library",
            studio: "studio",
            notifications: "notifications",
            settings: "settings",
            shares: "shares",
            moderation: "moderation",
            about: "about",
          };

          if (parts.length === 2 && /^\d+$/.test(parts[1]) && hosts[parts[0]]) {
            app = hosts[parts[0]] + "/" + parts[1];
            web = "/" + parts[0] + "/" + parts[1];
          } else if (parts.length === 1 && tabs[parts[0]]) {
            app = tabs[parts[0]];
            web = "/" + parts[0];
          } else if (parts.length === 1 && parts[0] === "search") {
            var term = (new URLSearchParams(location.search).get("q") || "").trim();
            app = "search" + (term ? "?q=" + encodeURIComponent(term) : "");
            web = "/search" + (term ? "?q=" + encodeURIComponent(term) : "");
          }

          if (!app) return;
          var key = "oru-app-hop:" + web;
          if (sessionStorage.getItem(key)) return;
          sessionStorage.setItem(key, "1");
          location.replace(
            "intent://" + app + "#Intent;scheme=oru;package=com.oru.app;" +
            "S.browser_fallback_url=" + encodeURIComponent(location.origin + web) + ";end"
          );
        } catch (error) {
          /* A browser without any of this simply stays on the page. */
        }
      })();
    </script>
